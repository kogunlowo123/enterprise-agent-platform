[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-agent-platform"
version = "0.1.0"
description = "Provider-neutral control plane for running LLM agents inside an enterprise: identity, governance, knowledge, model routing and runtime."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Kunle Ogunlowo" }]
keywords = ["agents", "llmops", "rag", "mcp", "ai-platform", "ai-security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "structlog>=24.1",
  "pyjwt[crypto]>=2.8",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29", "pgvector>=0.2.5"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/kogunlowo123/enterprise-agent-platform"
Documentation = "https://github.com/kogunlowo123/enterprise-agent-platform/tree/main/docs"
Issues = "https://github.com/kogunlowo123/enterprise-agent-platform/issues"

[project.scripts]
eap = "eap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
  "integration: requires an external service (postgres, live model provider)",
  "e2e: drives the assembled application through its HTTP surface",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = [
  "S101",   # assert: the test suite is built on it
  # Prose in docstrings uses typographic punctuation (en dashes, curly quotes) on purpose,
  # and the injection detector and its tests contain deliberately adversarial characters --
  # zero-width joiners, full-width Latin, bidirectional overrides. Flagging those as
  # "ambiguous" is correct in general and exactly backwards here.
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"tests/fixtures/**" = ["T201"]

[tool.mypy]
python_version = "3.11"
packages = ["eap"]
mypy_path = "src"
strict = true
warn_unreachable = true
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["opentelemetry.*", "structlog.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/eap"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
