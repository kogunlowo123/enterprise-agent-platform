# Gitleaks configuration.
#
# There is deliberately no allowlist for credential patterns here. The test suite needs
# credential-shaped values because the thing under test is a detector that finds them, and
# the obvious solution — allowlisting the pattern — weakens the scanner for everyone and
# teaches contributors to reach for an exemption whenever it fires.
#
# Instead the fixtures are assembled from fragments at runtime (see
# tests/synthetic_credentials.py), so no literal in this repository matches a scanner's
# pattern while the value handed to the detector is the real shape. The scanner stays at
# full strength and the tests keep testing what they claim to.

title = "enterprise-agent-platform"

[extend]
useDefault = true

[[allowlists]]
description = """
Documentation and the committed example environment file contain placeholder values such as
`EAP_LLMOPS_ANTHROPIC_API_KEY=` with nothing after it, and prose describing token formats.
"""
paths = [
  '''\.env\.example$''',
  '''docs/.*\.md$''',
  '''README\.md$''',
  '''CHANGELOG\.md$''',
]
