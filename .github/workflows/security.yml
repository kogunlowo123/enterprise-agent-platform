name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, because a dependency that was clean at merge time will not stay clean.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pip-audit

      # Audit a frozen requirement set rather than the live environment. The environment
      # contains this project installed with `pip install -e .`, which has no PyPI release
      # to look up: --strict then fails on the one package it has no reason to check, and
      # --skip-editable does not help because strict mode treats the skip as an error too.
      #
      # `pip freeze --exclude-editable` drops exactly that one entry and pins everything
      # else, so strict mode stays meaningful — an unresolvable dependency is still a
      # failure rather than a silent pass.
      - name: Freeze the dependency set
        run: python -m pip freeze --exclude-editable > requirements.lock

      - name: Audit dependencies
        run: python -m pip_audit --strict --progress-spinner off --requirement requirements.lock

      - name: Upload the audited dependency set
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: requirements-lock
          path: requirements.lock
          retention-days: 30

  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit[toml]

      # The test suite deliberately contains adversarial strings and asserts, so it is
      # excluded; scanning it produces findings about the fixtures rather than the product.
      - name: Scan source
        run: bandit -r src/eap -ll -f screen

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v3

  container:
    name: Container and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          load: true
          tags: enterprise-agent-platform:scan

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: enterprise-agent-platform:scan
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy-container

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: enterprise-agent-platform:scan
          format: cyclonedx
          output: sbom.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 90

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan history for committed credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
